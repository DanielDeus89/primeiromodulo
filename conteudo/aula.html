<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    English Listening Practice
  </title>


  <!-- ======================================================
       FONTE
  ======================================================= -->

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />


  <!-- ======================================================
       CSS PRINCIPAL
  ======================================================= -->

  <link
    rel="stylesheet"
    href="../css/style.css"
  />

</head>


<body>


  <!-- ======================================================
       MODO DESENVOLVEDOR
  ======================================================= -->

  <div
    id="devModeContainer"
    style="
      display: none;
      max-width: 1500px;
      margin: 15px auto;
      padding: 0 24px;
      text-align: center;
    "
  >

    <label
      for="devCheckbox"
      style="
        font-weight: 600;
        cursor: pointer;
      "
    >

      <input
        type="checkbox"
        id="devCheckbox"
        onchange="toggleDevMode()"
      />

      🛠️ Ativar Modo Desenvolvedor

    </label>

  </div>



  <!-- ======================================================
       CONTEÚDO PRINCIPAL
  ======================================================= -->

  <div
    style="
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    "
  >


    <!-- ====================================================
         CABEÇALHO
    ===================================================== -->

    <div
      style="
        display: grid;
        grid-template-columns: 1fr 560px;
        gap: 24px;
        align-items: center;
      "
    >


      <!-- ==================================================
           TÍTULO + CONTROLES
      =================================================== -->

      <section
        style="
          grid-column: 1 / 2;
        "
      >

        <div
          style="
            text-align: center;
          "
        >


          <!-- =================================================
               TÍTULO

               IMPORTANTE:
               O ID NÃO PODE SER lessonTitle.

               Os arquivos lessonXX.js e reviewXX.js usam:

               const lessonTitle = "Lesson 01";
               const lessonTitle = "Review 01";

               Por isso usamos lessonTitleElement.
          ================================================== -->

          <h1
            id="lessonTitleElement"
            style="
              margin: 0;
              user-select: none;
            "
          >
            Carregando conteúdo...
          </h1>



          <!-- =================================================
               INFORMAÇÃO
          ================================================== -->

          <p
            class="info-text"
            style="
              margin: 8px 0 12px 0;
            "
          >
            💡 Clique nas frases em azul para ouvir a pronúncia em inglês.
          </p>



          <!-- =================================================
               BOTÕES PRINCIPAIS
          ================================================== -->

          <div
            class="stack-controls"
            style="
              margin: 0;
              padding: 0;
            "
          >


            <!-- ANTERIOR -->

            <button
              type="button"
              onclick="prevCard()"
            >
              Anterior
            </button>



            <!-- VOLTAR 5 SEGUNDOS -->

            <button
              type="button"
              onclick="back5Seconds()"
            >
              Voltar 5s
            </button>



            <!-- PRÓXIMO -->

            <button
              type="button"
              id="nextBtn"
              onclick="nextCard()"
              disabled
            >
              Próximo
            </button>



            <!-- =================================================
                 COPIAR TEMPO

                 ESCONDIDO POR PADRÃO.
                 APARECE JUNTO COM DEV.
            ================================================== -->

            <button
              type="button"
              id="copyTimeBtn"
              onclick="copyCurrentVideoTime()"
              style="
                display: none;
              "
            >
              Copiar Tempo
            </button>


          </div>

        </div>

      </section>



      <!-- ==================================================
           PLAYER DO YOUTUBE
      =================================================== -->

      <aside
        style="
          grid-column: 2 / 3;
        "
      >


        <div
          class="video-container"
          style="
            width: 70%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
          "
        >

          <div
            id="player"
            style="
              width: 100%;
              height: 100%;
            "
          ></div>

        </div>



        <!-- =================================================
             STATUS DO PLAYER
        ================================================== -->

        <div
          id="videoStatus"
          style="
            display: none;
            margin-top: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
          "
        ></div>


      </aside>

    </div>



    <!-- ====================================================
         CARDS DA AULA
    ===================================================== -->

    <div
      style="
        margin-top: 24px;
      "
    >

      <div
        class="card-stack"
        id="cardStack"
      ></div>

    </div>


  </div>



  <!-- ======================================================
       API DO YOUTUBE
  ======================================================= -->

  <script>

    const youtubeApiScript =
      document.createElement(
        "script"
      );


    youtubeApiScript.src =
      "https://www.youtube.com/iframe_api";


    document.head.appendChild(
      youtubeApiScript
    );

  </script>



  <!-- ======================================================
       COPIAR TEMPO
  ======================================================= -->

  <script>

    async function copyCurrentVideoTime() {


      if (

        typeof player === "undefined" ||

        !player ||

        typeof player.getCurrentTime !==
          "function"

      ) {

        console.warn(
          "Player ainda não está pronto."
        );

        return;

      }


      const current =
        Math.round(
          player.getCurrentTime()
        );


      try {


        await navigator.clipboard.writeText(
          current.toString()
        );


        console.log(
          "Tempo copiado:",
          current
        );


        const button =
          document.getElementById(
            "copyTimeBtn"
          );


        if (button) {

          const originalText =
            button.textContent;


          button.textContent =
            `✓ ${current}s`;


          setTimeout(
            function () {

              button.textContent =
                originalText;

            },
            1000
          );

        }

      }


      catch (error) {

        console.error(
          "Erro ao copiar tempo:",
          error
        );

      }

    }

  </script>



  <!-- ======================================================
       SCRIPTS DO SISTEMA
  ======================================================= -->

  <script
    src="../js/engine.js"
  ></script>


  <script
    src="../js/player.js"
  ></script>


  <script
    src="../js/card.js"
  ></script>


  <script
    src="../js/5s.js"
  ></script>



  <!-- ======================================================
       CARREGADOR DA AULA / REVIEW
  ======================================================= -->

  <script>


    // ======================================================
    // CARREGAR CONTEÚDO
    //
    // SUPORTA:
    //
    // aula.html?lesson=01
    //
    // aula.html?review=01
    // ======================================================

    function loadContent() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      let lesson =
        params.get(
          "lesson"
        );


      let review =
        params.get(
          "review"
        );


      let scriptPath =
        null;


      let contentName =
        null;



      // ====================================================
      // LESSON
      // ====================================================

      if (lesson) {


        if (
          /^\d+$/.test(
            lesson
          )
        ) {

          lesson =
            lesson.padStart(
              2,
              "0"
            );

        }


        scriptPath =
          `../js/lessons/lesson${lesson}.js`;


        contentName =
          `Lesson ${lesson}`;


        console.log(
          "======================================"
        );


        console.log(
          "Tipo: LESSON"
        );


        console.log(
          "Número:",
          lesson
        );


        console.log(
          "Arquivo:",
          scriptPath
        );


        console.log(
          "======================================"
        );

      }



      // ====================================================
      // REVIEW
      // ====================================================

      else if (review) {


        if (
          /^\d+$/.test(
            review
          )
        ) {

          review =
            review.padStart(
              2,
              "0"
            );

        }


        scriptPath =
          `../js/reviews/review${review}.js`;


        contentName =
          `Review ${review}`;


        console.log(
          "======================================"
        );


        console.log(
          "Tipo: REVIEW"
        );


        console.log(
          "Número:",
          review
        );


        console.log(
          "Arquivo:",
          scriptPath
        );


        console.log(
          "======================================"
        );

      }



      // ====================================================
      // SEM PARÂMETRO
      // ====================================================

      else {


        console.error(
          "Nenhuma Lesson ou Review informada."
        );


        showContentError(
          "Nenhuma Lesson ou Review informada."
        );


        return;

      }



      // ====================================================
      // CRIAR SCRIPT
      // ====================================================

      const contentScript =
        document.createElement(
          "script"
        );


      contentScript.src =
        scriptPath;



      // ====================================================
      // CARREGADO
      // ====================================================

      contentScript.onload =
        function () {


          console.log(
            `${contentName} carregado com sucesso.`
          );



          // =================================================
          // VALIDAR lessonTitle
          // =================================================

          if (
            typeof lessonTitle !==
              "string"
          ) {


            console.error(
              "lessonTitle inválido:",
              typeof lessonTitle
            );


            showContentError(
              "lessonTitle não definido corretamente."
            );


            return;

          }



          // =================================================
          // VALIDAR VIDEO
          // =================================================

          if (
            typeof currentVideoId ===
              "undefined" ||
            !currentVideoId
          ) {


            showContentError(
              "currentVideoId não definido."
            );


            return;

          }



          // =================================================
          // VALIDAR CARDS
          // =================================================

          if (
            typeof lessonCards ===
              "undefined" ||
            !Array.isArray(
              lessonCards
            )
          ) {


            showContentError(
              "lessonCards não definido corretamente."
            );


            return;

          }



          // =================================================
          // VALIDAR RANGES
          // =================================================

          if (
            typeof timeRanges ===
              "undefined" ||
            !Array.isArray(
              timeRanges
            )
          ) {


            showContentError(
              "timeRanges não definido corretamente."
            );


            return;

          }



          // =================================================
          // TÍTULO
          // =================================================

          const titleElement =
            document.getElementById(
              "lessonTitleElement"
            );


          if (titleElement) {

            titleElement.textContent =
              lessonTitle;

          }



          console.log(
            "Título:",
            lessonTitle
          );


          console.log(
            "Vídeo:",
            currentVideoId
          );


          console.log(
            "Cards:",
            lessonCards.length
          );


          console.log(
            "Ranges:",
            timeRanges.length
          );



          // =================================================
          // INICIALIZAR ENGINE
          // =================================================

          if (
            typeof initializeLesson ===
              "function"
          ) {


            initializeLesson();

          }


          else {


            showContentError(
              "initializeLesson() não encontrada."
            );

          }

        };



      // ====================================================
      // ERRO AO CARREGAR JS
      // ====================================================

      contentScript.onerror =
        function () {


          console.error(
            "Não foi possível carregar:",
            scriptPath
          );


          showContentError(
            `Não foi possível carregar ${contentName}.`
          );

        };


      document.body.appendChild(
        contentScript
      );

    }



    // ======================================================
    // ERRO VISUAL
    // ======================================================

    function showContentError(
      message
    ) {


      console.error(
        message
      );


      const titleElement =
        document.getElementById(
          "lessonTitleElement"
        );


      if (titleElement) {

        titleElement.textContent =
          "Conteúdo não encontrado";

      }


      const status =
        document.getElementById(
          "videoStatus"
        );


      if (status) {

        status.style.display =
          "block";


        status.textContent =
          `⚠️ ${message}`;

      }

    }



    // ======================================================
    // FERRAMENTAS DE DESENVOLVIMENTO
    // ======================================================

    const lessonTitleElement =
      document.getElementById(
        "lessonTitleElement"
      );


    const devModeContainer =
      document.getElementById(
        "devModeContainer"
      );


    const copyTimeBtn =
      document.getElementById(
        "copyTimeBtn"
      );



    if (

      lessonTitleElement &&

      devModeContainer &&

      copyTimeBtn

    ) {


      lessonTitleElement.addEventListener(

        "dblclick",

        function () {


          const estaOculto =
            window.getComputedStyle(
              devModeContainer
            ).display ===
            "none";



          // =================================================
          // MOSTRAR
          // =================================================

          if (estaOculto) {


            devModeContainer.style.display =
              "block";


            copyTimeBtn.style.display =
              "inline-block";


            console.log(
              "Ferramentas DEV exibidas."
            );

          }



          // =================================================
          // ESCONDER
          // =================================================

          else {


            devModeContainer.style.display =
              "none";


            copyTimeBtn.style.display =
              "none";


            const checkbox =
              document.getElementById(
                "devCheckbox"
              );


            if (

              checkbox &&

              checkbox.checked

            ) {


              checkbox.checked =
                false;


              if (

                typeof toggleDevMode ===
                  "function"

              ) {

                toggleDevMode();

              }

            }


            console.log(
              "Ferramentas DEV ocultadas."
            );

          }

        }

      );

    }



    // ======================================================
    // INICIAR
    // ======================================================

    loadContent();


  </script>


</body>

</html>
