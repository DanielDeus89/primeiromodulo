<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Painel do Professor
  </title>


  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >


  <style>


    /* ======================================================
       RESET
    ======================================================= */

    * {

      box-sizing:
        border-box;

      margin:
        0;

      padding:
        0;

    }



    /* ======================================================
       BODY
    ======================================================= */

    body {

      font-family:
        "Inter",
        sans-serif;

      background:
        linear-gradient(
          to right,
          #000000,
          #0f172a
        );

      color:
        #e2e8f0;

      min-height:
        100vh;

      padding:
        30px;

    }



    /* ======================================================
       CONTAINER
    ======================================================= */

    .teacher-container {

      width:
        100%;

      max-width:
        1200px;

      margin:
        0 auto;

    }



    /* ======================================================
       CABEÇALHO
    ======================================================= */

    .teacher-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        20px;

      margin-bottom:
        25px;

      flex-wrap:
        wrap;

    }



    .teacher-header h1 {

      font-size:
        32px;

    }



    .teacher-subtitle {

      color:
        #94a3b8;

      font-size:
        14px;

      margin-top:
        5px;

    }



    .counter-group {

      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

    }



    .counter {

      background:
        #1e293b;

      padding:
        10px 16px;

      border-radius:
        8px;

      font-weight:
        600;

    }



    /* ======================================================
       CARD PRINCIPAL
    ======================================================= */

    .lesson-card {

      background:
        #e2e8f0;

      color:
        #0f172a;

      border-radius:
        16px;

      padding:
        30px;

      margin-bottom:
        25px;

      box-shadow:
        0 4px 18px rgba(
          0,
          0,
          0,
          0.35
        );

    }



    .lesson-card-title {

      text-align:
        center;

      font-size:
        26px;

      margin-bottom:
        25px;

      color:
        #1e293b;

    }



    /* ======================================================
       COLUNAS DO CARD
    ======================================================= */

    .lesson-columns {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            250px,
            1fr
          )
        );

      gap:
        25px;

    }



    .lesson-column {

      display:
        flex;

      flex-direction:
        column;

      gap:
        15px;

    }



    .lesson-item {

      padding:
        10px 12px;

      border-radius:
        8px;

      background:
        #f8fafc;

    }



    .lesson-english {

      color:
        #2563eb;

      font-size:
        22px;

      font-weight:
        700;

      line-height:
        1.4;

    }



    .lesson-portuguese {

      color:
        #475569;

      font-size:
        15px;

      margin-top:
        4px;

    }



    /* ======================================================
       LISTENING
    ======================================================= */

    .listening-list {

      display:
        flex;

      flex-direction:
        column;

      gap:
        12px;

    }



    .listening-item {

      background:
        #f8fafc;

      padding:
        14px;

      border-radius:
        8px;

      color:
        #2563eb;

      font-size:
        20px;

      font-weight:
        600;

    }



    /* ======================================================
       TREINO DO PROFESSOR
    ======================================================= */

    .teacher-practice-container {

      display:
        none;

      margin-top:
        30px;

    }



    .teacher-practice-title {

      font-size:
        22px;

      margin-bottom:
        18px;

    }



    .current-practice {

      background:
        #e0e3e7;

      color:
        #1e293b;

      border-radius:
        16px;

      padding:
        35px;

      min-height:
        190px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      margin-bottom:
        20px;

      box-shadow:
        0 4px 15px rgba(
          0,
          0,
          0,
          0.35
        );

    }



    .practice-label {

      font-size:
        15px;

      color:
        #64748b;

      text-transform:
        uppercase;

      font-weight:
        700;

      letter-spacing:
        1px;

      margin-bottom:
        18px;

    }



    #currentPhrase {

      font-size:
        34px;

      line-height:
        1.5;

      font-weight:
        700;

      color:
        #2c66ad;

      word-break:
        break-word;

    }



    /* ======================================================
       NAVEGAÇÃO DO TREINO
    ======================================================= */

    .navigation {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        25px;

      flex-wrap:
        wrap;

    }



    .navigation button {

      border:
        none;

      background:
        #334155;

      color:
        white;

      padding:
        12px 24px;

      border-radius:
        8px;

      cursor:
        pointer;

      font-size:
        16px;

      font-weight:
        600;

    }



    .navigation button:hover {

      background:
        #475569;

    }



    .navigation button:disabled {

      opacity:
        0.4;

      cursor:
        not-allowed;

    }



    #phraseCounter {

      min-width:
        100px;

      text-align:
        center;

      font-weight:
        600;

    }



    /* ======================================================
       LISTA DE TREINO
    ======================================================= */

    .practice-list {

      display:
        flex;

      flex-direction:
        column;

      gap:
        8px;

    }



    .practice-item {

      background:
        #1e293b;

      padding:
        12px 15px;

      border-radius:
        8px;

      cursor:
        pointer;

      display:
        flex;

      gap:
        12px;

      align-items:
        center;

      transition:
        0.2s;

    }



    .practice-item:hover {

      background:
        #334155;

    }



    .practice-item.active {

      background:
        #2563eb;

    }



    .practice-number {

      min-width:
        32px;

      color:
        #93c5fd;

      font-weight:
        700;

    }



    .practice-item.active
    .practice-number {

      color:
        white;

    }



    /* ======================================================
       SEM TREINO
    ======================================================= */

    .no-practice {

      background:
        #1e293b;

      color:
        #94a3b8;

      border-radius:
        10px;

      padding:
        18px;

      text-align:
        center;

      margin-top:
        20px;

    }



    /* ======================================================
       ERRO
    ======================================================= */

    .error {

      background:
        #7f1d1d;

      padding:
        20px;

      border-radius:
        10px;

      text-align:
        center;

      font-weight:
        600;

    }



    /* ======================================================
       RESPONSIVO
    ======================================================= */

    @media (
      max-width: 700px
    ) {

      body {

        padding:
          15px;

      }


      .teacher-header h1 {

        font-size:
          25px;

      }


      #currentPhrase {

        font-size:
          26px;

      }


      .lesson-english {

        font-size:
          19px;

      }

    }


  </style>

</head>


<body>


  <div
    class="teacher-container"
  >


    <!-- ====================================================
         CABEÇALHO
    ===================================================== -->

    <div
      class="teacher-header"
    >


      <div>

        <h1
          id="teacherLessonTitle"
        >
          Carregando...
        </h1>


        <div
          class="teacher-subtitle"
        >
          Painel do Professor
        </div>

      </div>



      <div
        class="counter-group"
      >


        <div
          class="counter"
          id="cardCounter"
        >
          Card - / -
        </div>


        <div
          class="counter"
          id="contentCounter"
        >
          -
        </div>


      </div>


    </div>



    <!-- ====================================================
         MESMO CARD DO ALUNO
    ===================================================== -->

    <div
      class="lesson-card"
      id="lessonCard"
    >


      <h2
        class="lesson-card-title"
        id="lessonCardTitle"
      >
        Carregando...
      </h2>


      <div
        id="lessonCardContent"
      ></div>


    </div>



    <!-- ====================================================
         TREINO ADICIONAL DO PROFESSOR
    ===================================================== -->

    <div
      class="teacher-practice-container"
      id="teacherPracticeContainer"
    >


      <h2
        class="teacher-practice-title"
      >
        Treino do Professor
      </h2>



      <div
        class="current-practice"
      >


        <div
          class="practice-label"
          id="practiceLabel"
        >
          Prática oral
        </div>


        <div
          id="currentPhrase"
        >
          -
        </div>


      </div>



      <div
        class="navigation"
      >


        <button
          type="button"
          id="prevPhraseBtn"
          onclick="previousPhrase()"
        >
          ← Anterior
        </button>


        <span
          id="phraseCounter"
        >
          0 / 0
        </span>


        <button
          type="button"
          id="nextPhraseBtn"
          onclick="nextPhrase()"
        >
          Próxima →
        </button>


      </div>



      <div
        class="practice-list"
        id="practiceList"
      ></div>


    </div>



    <!-- ====================================================
         SEM TREINO EXTRA
    ===================================================== -->

    <div
      class="no-practice"
      id="noPracticeMessage"
    >
      Este card não possui treino adicional para o professor.
    </div>


  </div>



  <script>


    // ======================================================
    // ESTADO
    // ======================================================

    let currentTeacherLesson =
      null;


    let currentCardIndex =
      0;


    let currentPractice =
      [];


    let currentPhraseIndex =
      0;



    // ======================================================
    // CANAL DE SINCRONIZAÇÃO
    // ======================================================

    const teacherSyncChannel =
      new BroadcastChannel(
        "teacherLessonSync"
      );



    // ======================================================
    // CARREGAR LESSON
    // ======================================================

    function loadTeacherLesson() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      let lesson =
        params.get(
          "lesson"
        ) || "01";


      if (
        /^\d+$/.test(
          lesson
        )
      ) {

        lesson =
          lesson.padStart(
            2,
            "0"
          );

      }


      currentTeacherLesson =
        lesson;


      console.log(
        "Carregando Professor:",
        lesson
      );


      const script =
        document.createElement(
          "script"
        );


      script.src =
        `../js/lessons/lesson${lesson}.js`;


      script.onload =
        function () {


          console.log(
            `Lesson ${lesson} carregada no professor.`
          );


          initializeTeacherPanel();

        };


      script.onerror =
        function () {


          showError(
            `Não foi possível carregar lesson${lesson}.js`
          );

        };


      document.body.appendChild(
        script
      );

    }



    // ======================================================
    // INICIALIZAR
    // ======================================================

    function initializeTeacherPanel() {


      if (
        typeof lessonTitle !==
          "string"
      ) {

        showError(
          "lessonTitle não encontrado."
        );


        return;

      }


      if (
        typeof lessonCards ===
          "undefined" ||
        !Array.isArray(
          lessonCards
        )
      ) {

        showError(
          "lessonCards não encontrado."
        );


        return;

      }


      const title =
        document.getElementById(
          "teacherLessonTitle"
        );


      title.textContent =
        `${lessonTitle} - Professor`;


      document.title =
        `${lessonTitle} - Professor`;



      // ====================================================
      // PEGAR ÚLTIMO ESTADO DO ALUNO
      // ====================================================

      const savedState =
        getLastTeacherSyncState();


      if (
        savedState &&
        savedState.type === "lesson" &&
        savedState.number ===
          currentTeacherLesson
      ) {

        currentCardIndex =
          Number(
            savedState.cardIndex
          ) || 0;

      }

      else {

        currentCardIndex =
          0;

      }



      // ====================================================
      // VALIDAR CARD
      // ====================================================

      if (
        currentCardIndex < 0 ||
        currentCardIndex >=
          lessonCards.length
      ) {

        currentCardIndex =
          0;

      }


      renderTeacherCard();

    }



    // ======================================================
    // ÚLTIMO ESTADO SALVO
    // ======================================================

    function getLastTeacherSyncState() {


      try {


        return JSON.parse(
          localStorage.getItem(
            "teacherLessonSyncState"
          )
        );


      }

      catch (error) {


        console.warn(
          "Erro ao ler sincronização:",
          error
        );


        return null;

      }

    }



    // ======================================================
    // RECEBER SINCRONIZAÇÃO
    // ======================================================

    teacherSyncChannel.onmessage =
      function (event) {


        handleTeacherSync(
          event.data
        );

      };



    // ======================================================
    // PROCESSAR SINCRONIZAÇÃO
    // ======================================================

    function handleTeacherSync(
      state
    ) {


      if (!state) {

        return;

      }


      if (
        state.type !==
        "lesson"
      ) {

        return;

      }


      console.log(
        "Sincronização recebida:",
        state
      );



      // ====================================================
      // MUDOU DE LESSON
      // ====================================================

      if (
        state.number &&
        state.number !==
          currentTeacherLesson
      ) {


        window.location.href =
          `professor.html?lesson=${state.number}`;


        return;

      }



      // ====================================================
      // MESMA LESSON
      // ====================================================

      const newCardIndex =
        Number(
          state.cardIndex
        );


      if (
        !Number.isInteger(
          newCardIndex
        )
      ) {

        return;

      }


      if (
        newCardIndex < 0 ||
        typeof lessonCards ===
          "undefined" ||
        newCardIndex >=
          lessonCards.length
      ) {

        return;

      }


      // ====================================================
      // CARD MUDOU
      // ====================================================

      if (
        newCardIndex !==
        currentCardIndex
      ) {


        currentCardIndex =
          newCardIndex;


        currentPhraseIndex =
          0;


        renderTeacherCard();

      }


      else {


        updateCardCounter();

      }

    }



    // ======================================================
    // RENDERIZAR CARD
    // ======================================================

    function renderTeacherCard() {


      const card =
        lessonCards[
          currentCardIndex
        ];


      if (!card) {

        return;

      }


      // ====================================================
      // TÍTULO
      // ====================================================

      document.getElementById(
        "lessonCardTitle"
      ).textContent =
        card.title ||
        `Card ${currentCardIndex + 1}`;



      // ====================================================
      // CONTADOR
      // ====================================================

      updateCardCounter();



      // ====================================================
      // CONTEÚDO
      // ====================================================

      const content =
        document.getElementById(
          "lessonCardContent"
        );


      content.innerHTML =
        "";



      // ====================================================
      // LISTENING
      // ====================================================

      if (
        card.type ===
          "listening"
      ) {


        renderListeningCard(
          card,
          content
        );

      }


      // ====================================================
      // CARD NORMAL
      // ====================================================

      else {


        renderNormalCard(
          card,
          content
        );

      }



      // ====================================================
      // TREINO DO PROFESSOR
      // ====================================================

      loadTeacherPracticeForCurrentCard();

    }



    // ======================================================
    // CONTADOR DO CARD
    // ======================================================

    function updateCardCounter() {


      const counter =
        document.getElementById(
          "cardCounter"
        );


      if (!counter) {

        return;

      }


      counter.textContent =
        `Card ${currentCardIndex + 1} de ${lessonCards.length}`;

    }



    // ======================================================
    // CARD NORMAL
    // ======================================================

    function renderNormalCard(
      card,
      container
    ) {


      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "lesson-columns";


      if (
        !Array.isArray(
          card.columns
        )
      ) {

        container.appendChild(
          grid
        );


        return;

      }


      card.columns.forEach(
        function (columnData) {


          const column =
            document.createElement(
              "div"
            );


          column.className =
            "lesson-column";


          if (
            !Array.isArray(
              columnData
            )
          ) {

            grid.appendChild(
              column
            );


            return;

          }


          columnData.forEach(
            function (item) {


              if (
                !Array.isArray(
                  item
                )
              ) {

                return;

              }


              const english =
                item[0] ||
                "";


              const portuguese =
                item[1] ||
                "";


              const row =
                document.createElement(
                  "div"
                );


              row.className =
                "lesson-item";


              const englishElement =
                document.createElement(
                  "div"
                );


              englishElement.className =
                "lesson-english";


              englishElement.textContent =
                english;


              row.appendChild(
                englishElement
              );


              if (portuguese) {


                const portugueseElement =
                  document.createElement(
                    "div"
                  );


                portugueseElement.className =
                  "lesson-portuguese";


                portugueseElement.textContent =
                  portuguese;


                row.appendChild(
                  portugueseElement
                );

              }


              column.appendChild(
                row
              );

            }
          );


          grid.appendChild(
            column
          );

        }
      );


      container.appendChild(
        grid
      );

    }



    // ======================================================
    // LISTENING
    // ======================================================

    function renderListeningCard(
      card,
      container
    ) {


      const list =
        document.createElement(
          "div"
        );


      list.className =
        "listening-list";


      if (
        Array.isArray(
          card.segments
        )
      ) {


        card.segments.forEach(
          function (segment) {


            const row =
              document.createElement(
                "div"
              );


            row.className =
              "listening-item";


            row.textContent =
              segment.text ||
              "";


            list.appendChild(
              row
            );

          }
        );

      }


      container.appendChild(
        list
      );

    }



    // ======================================================
    // TREINO DO CARD ATUAL
    // ======================================================

    function loadTeacherPracticeForCurrentCard() {


      const practiceContainer =
        document.getElementById(
          "teacherPracticeContainer"
        );


      const noPractice =
        document.getElementById(
          "noPracticeMessage"
        );


      currentPractice =
        [];


      // ====================================================
      // EXISTE teacherPracticeByCard?
      // ====================================================

      if (
        typeof teacherPracticeByCard !==
          "undefined" &&
        teacherPracticeByCard &&
        Array.isArray(
          teacherPracticeByCard[
            currentCardIndex
          ]
        )
      ) {


        currentPractice =
          teacherPracticeByCard[
            currentCardIndex
          ];


      }



      // ====================================================
      // SEM TREINO
      // ====================================================

      if (
        currentPractice.length ===
        0
      ) {


        practiceContainer.style.display =
          "none";


        noPractice.style.display =
          "block";


        document.getElementById(
          "contentCounter"
        ).textContent =
          "Sem treino extra";


        return;

      }



      // ====================================================
      // COM TREINO
      // ====================================================

      practiceContainer.style.display =
        "block";


      noPractice.style.display =
        "none";


      document.getElementById(
        "contentCounter"
      ).textContent =
        `${currentPractice.length} treinos`;


      currentPhraseIndex =
        0;


      renderCurrentPhrase();


      renderPracticeList();

    }



    // ======================================================
    // FRASE ATUAL
    // ======================================================

    function renderCurrentPhrase() {


      if (
        !Array.isArray(
          currentPractice
        ) ||
        currentPractice.length ===
          0
      ) {

        return;

      }


      if (
        currentPhraseIndex < 0
      ) {

        currentPhraseIndex =
          0;

      }


      if (
        currentPhraseIndex >=
        currentPractice.length
      ) {

        currentPhraseIndex =
          currentPractice.length - 1;

      }


      document.getElementById(
        "currentPhrase"
      ).textContent =
        currentPractice[
          currentPhraseIndex
        ];


      document.getElementById(
        "phraseCounter"
      ).textContent =
        `${currentPhraseIndex + 1} / ${currentPractice.length}`;


      document.getElementById(
        "prevPhraseBtn"
      ).disabled =
        currentPhraseIndex ===
        0;


      document.getElementById(
        "nextPhraseBtn"
      ).disabled =
        currentPhraseIndex >=
        currentPractice.length - 1;


      updateActivePracticeItem();

    }



    // ======================================================
    // LISTA DE TREINO
    // ======================================================

    function renderPracticeList() {


      const container =
        document.getElementById(
          "practiceList"
        );


      container.innerHTML =
        "";


      currentPractice.forEach(
        function (
          text,
          index
        ) {


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "practice-item";


          row.dataset.index =
            index;



          const number =
            document.createElement(
              "span"
            );


          number.className =
            "practice-number";


          number.textContent =
            `${index + 1}.`;



          const phrase =
            document.createElement(
              "span"
            );


          phrase.textContent =
            text;



          row.appendChild(
            number
          );


          row.appendChild(
            phrase
          );


          row.addEventListener(
            "click",
            function () {


              currentPhraseIndex =
                index;


              renderCurrentPhrase();

            }
          );


          container.appendChild(
            row
          );

        }
      );


      updateActivePracticeItem();

    }



    // ======================================================
    // ITEM ATIVO
    // ======================================================

    function updateActivePracticeItem() {


      const items =
        document.querySelectorAll(
          ".practice-item"
        );


      items.forEach(
        function (item) {


          item.classList.remove(
            "active"
          );

        }
      );


      const active =
        document.querySelector(
          `.practice-item[data-index="${currentPhraseIndex}"]`
        );


      if (active) {


        active.classList.add(
          "active"
        );


        active.scrollIntoView(
          {

            block:
              "nearest",

            behavior:
              "smooth"

          }
        );

      }

    }



    // ======================================================
    // FRASE ANTERIOR
    // ======================================================

    function previousPhrase() {


      if (
        currentPractice.length ===
          0 ||
        currentPhraseIndex <=
          0
      ) {

        return;

      }


      currentPhraseIndex--;


      renderCurrentPhrase();

    }



    // ======================================================
    // PRÓXIMA FRASE
    // ======================================================

    function nextPhrase() {


      if (
        currentPractice.length ===
          0 ||
        currentPhraseIndex >=
          currentPractice.length - 1
      ) {

        return;

      }


      currentPhraseIndex++;


      renderCurrentPhrase();

    }



    // ======================================================
    // TECLADO
    //
    // IMPORTANTE:
    //
    // AS SETAS CONTROLAM APENAS AS FRASES DE TREINO.
    // NÃO MUDAM O CARD DO PROFESSOR.
    //
    // O CARD É CONTROLADO PELO ALUNO.
    // ======================================================

    document.addEventListener(
      "keydown",
      function (event) {


        const target =
          event.target;


        const tag =
          target &&
          target.tagName
            ? target.tagName.toLowerCase()
            : "";


        if (
          tag === "input" ||
          tag === "textarea" ||
          tag === "select"
        ) {

          return;

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {


          event.preventDefault();


          previousPhrase();

        }


        if (
          event.key ===
          "ArrowRight"
        ) {


          event.preventDefault();


          nextPhrase();

        }

      }
    );



    // ======================================================
    // ERRO
    // ======================================================

    function showError(
      message
    ) {


      const container =
        document.querySelector(
          ".teacher-container"
        );


      if (!container) {

        return;

      }


      container.innerHTML =
        `<div class="error">${message}</div>`;

    }



    // ======================================================
    // INICIAR
    // ======================================================

    loadTeacherLesson();


  </script>


</body>
