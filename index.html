<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Menu de Aulas</title>

  <link
    rel="stylesheet"
    href="./css/menu.css"
  />

</head>


<body>


  <!-- ======================================================
       BOTÃO DO MENU
  ======================================================= -->

  <div
    class="menu-toggle"
    onclick="toggleSidebar()"
  >
    ☰ Menu
  </div>



  <!-- ======================================================
       MENU LATERAL
  ======================================================= -->

  <div
    class="sidebar"
    id="sidebar"
  >

    <div
      class="sidebar-header"
    >

      <span
        class="close-btn"
        onclick="toggleSidebar()"
      >
        ✖
      </span>

    </div>



    <!-- ====================================================
         MODO PROFESSOR
    ===================================================== -->

    <div
      style="
        padding: 10px;
        margin-bottom: 10px;
      "
    >

      <button
        type="button"
        id="teacherLoginBtn"
        onclick="showTeacherLogin()"
        style="
          width: 100%;
          padding: 10px;
          border: none;
          border-radius: 8px;
          background: #334155;
          color: white;
          cursor: pointer;
          font-weight: 600;
        "
      >
        🔐 Modo Professor
      </button>


      <div
        id="teacherStatus"
        style="
          display: none;
          margin-top: 8px;
          font-size: 13px;
          text-align: center;
          color: #86efac;
        "
      >
        ✓ Professor autenticado
      </div>

    </div>



    <!-- ====================================================
         AULAS 01 ATÉ 60
    ===================================================== -->

    <ul
      id="lessonMenu"
    ></ul>

  </div>



  <!-- ======================================================
       TELA PRINCIPAL / ALUNO
  ======================================================= -->

  <div
    class="main-content"
  >

    <iframe
      id="iframeAula"
      src=""
      title="Conteúdo da aula"
      allow="autoplay; fullscreen"
    ></iframe>

  </div>



  <!-- ======================================================
       LOGIN DO PROFESSOR
  ======================================================= -->

  <div
    id="teacherLoginOverlay"
    style="
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 5000;
      align-items: center;
      justify-content: center;
    "
  >

    <div
      style="
        width: 90%;
        max-width: 380px;
        background: #1e293b;
        border-radius: 12px;
        padding: 28px;
        color: white;
        box-shadow: 0 10px 35px rgba(0,0,0,0.5);
      "
    >

      <h2
        style="
          margin-bottom: 10px;
          text-align: center;
        "
      >
        🔐 Acesso do Professor
      </h2>


      <p
        style="
          margin-bottom: 20px;
          text-align: center;
          color: #cbd5e1;
          font-size: 14px;
        "
      >
        Digite o código de acesso.
      </p>


      <input
        type="password"
        id="teacherPassword"
        placeholder="Código de acesso"
        autocomplete="current-password"
        style="
          width: 100%;
          padding: 12px;
          margin-bottom: 12px;
          border: 1px solid #475569;
          border-radius: 8px;
          background: #0f172a;
          color: white;
          font-size: 16px;
          outline: none;
        "
      />


      <div
        id="teacherLoginError"
        style="
          display: none;
          margin-bottom: 12px;
          color: #fca5a5;
          font-size: 13px;
          text-align: center;
        "
      >
        Código inválido.
      </div>


      <div
        style="
          display: flex;
          gap: 10px;
        "
      >

        <button
          type="button"
          onclick="closeTeacherLogin()"
          style="
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #475569;
            color: white;
            cursor: pointer;
          "
        >
          Cancelar
        </button>


        <button
          type="button"
          id="teacherEnterBtn"
          onclick="authenticateTeacher()"
          style="
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: 600;
          "
        >
          Entrar
        </button>

      </div>

    </div>

  </div>



  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>


    // ======================================================
    // CONFIGURAÇÕES
    // ======================================================

    const TOTAL_LESSONS = 60;

    const LESSONS_PER_REVIEW = 6;



    // ======================================================
    // ESTADO
    // ======================================================

    let teacherMode = false;

    let teacherTab = null;

    let meetTab = null;

    let meetOpened = false;

    let currentLesson = null;

    let googleMeetUrl = null;



    // ======================================================
    // SIDEBAR
    // ======================================================

    function toggleSidebar() {

      const sidebar =
        document.getElementById(
          "sidebar"
        );


      if (!sidebar) {
        return;
      }


      sidebar.classList.toggle(
        "active"
      );

    }



    function fecharSidebar() {

      const sidebar =
        document.getElementById(
          "sidebar"
        );


      if (!sidebar) {
        return;
      }


      sidebar.classList.remove(
        "active"
      );

    }



    // ======================================================
    // FORMATAR NÚMERO
    // ======================================================

    function formatLessonNumber(number) {

      return String(number).padStart(
        2,
        "0"
      );

    }



    // ======================================================
    // CRIAR MENU
    // ======================================================

    function createLessonMenu() {

      const menu =
        document.getElementById(
          "lessonMenu"
        );


      if (!menu) {
        return;
      }


      menu.innerHTML = "";



      for (
        let number = 1;
        number <= TOTAL_LESSONS;
        number++
      ) {


        const lessonNumber =
          formatLessonNumber(
            number
          );


        createLessonItem(
          menu,
          lessonNumber
        );



        // ==================================================
        // REVIEW A CADA 6 AULAS
        // ==================================================

        if (
          number %
          LESSONS_PER_REVIEW ===
          0
        ) {

          const reviewNumber =
            number /
            LESSONS_PER_REVIEW;


          createReviewItem(
            menu,
            reviewNumber
          );

        }

      }

    }



    // ======================================================
    // CRIAR AULA
    // ======================================================

    function createLessonItem(
      menu,
      lessonNumber
    ) {

      const li =
        document.createElement(
          "li"
        );


      const link =
        document.createElement(
          "a"
        );


      link.href = "#";


      link.textContent =
        `📘 Aula ${lessonNumber}`;


      link.addEventListener(
        "click",
        function (event) {

          event.preventDefault();


          carregarAula(
            link,
            `aula${lessonNumber}`
          );

        }
      );


      li.appendChild(link);

      menu.appendChild(li);

    }



    // ======================================================
    // CRIAR REVIEW
    // ======================================================

    function createReviewItem(
      menu,
      reviewNumber
    ) {

      const li =
        document.createElement(
          "li"
        );


      const link =
        document.createElement(
          "a"
        );


      link.href = "#";


      link.textContent =
        `📘 Review ${formatLessonNumber(
          reviewNumber
        )}`;


      link.addEventListener(
        "click",
        function (event) {

          event.preventDefault();


          carregarAula(
            link,
            `review${reviewNumber}`
          );

        }
      );


      li.appendChild(link);

      menu.appendChild(li);

    }



    // ======================================================
    // CARREGAR AULA / REVIEW
    // ======================================================

    function carregarAula(
      elemento,
      aula
    ) {

      let url = null;



      // ====================================================
      // REVIEW
      // ====================================================

      if (
        aula.startsWith(
          "review"
        )
      ) {

        url =
          `./conteudo/${aula}.html`;


        carregarNoIframe(
          url
        );

      }



      // ====================================================
      // AULA
      // ====================================================

      else if (
        aula.startsWith(
          "aula"
        )
      ) {


        const numero =
          aula.replace(
            "aula",
            ""
          );


        currentLesson =
          numero;



        // ==================================================
        // TELA DO ALUNO
        // ==================================================

        url =
          `./conteudo/aula.html?lesson=${numero}`;


        carregarNoIframe(
          url
        );



        // ==================================================
        // PROFESSOR AUTENTICADO?
        //
        // Só então mexemos na aba do professor.
        // ==================================================

        if (teacherMode) {

          atualizarAmbienteProfessor(
            numero
          );

        }

      }



      // ====================================================
      // INVÁLIDO
      // ====================================================

      else {

        console.error(
          "Tipo inválido:",
          aula
        );

        return;

      }



      marcarItemAtivo(
        elemento
      );


      fecharSidebar();

    }



    // ======================================================
    // IFRAME DO ALUNO
    // ======================================================

    function carregarNoIframe(
      url
    ) {

      const iframe =
        document.getElementById(
          "iframeAula"
        );


      if (!iframe) {
        return;
      }


      iframe.src =
        url;

    }



    // ======================================================
    // ITEM ATIVO
    // ======================================================

    function marcarItemAtivo(
      elemento
    ) {

      const links =
        document.querySelectorAll(
          ".sidebar a"
        );


      links.forEach(
        function (link) {

          link.classList.remove(
            "active"
          );

        }
      );


      if (elemento) {

        elemento.classList.add(
          "active"
        );

      }

    }



    // ======================================================
    // MOSTRAR LOGIN
    // ======================================================

    function showTeacherLogin() {

      if (teacherMode) {

        alert(
          "Modo Professor já está ativo."
        );

        return;

      }


      const overlay =
        document.getElementById(
          "teacherLoginOverlay"
        );


      const password =
        document.getElementById(
          "teacherPassword"
        );


      const error =
        document.getElementById(
          "teacherLoginError"
        );


      error.style.display =
        "none";


      password.value =
        "";


      overlay.style.display =
        "flex";


      setTimeout(
        function () {

          password.focus();

        },
        50
      );

    }



    // ======================================================
    // FECHAR LOGIN
    // ======================================================

    function closeTeacherLogin() {

      const overlay =
        document.getElementById(
          "teacherLoginOverlay"
        );


      overlay.style.display =
        "none";

    }



    // ======================================================
    // AUTENTICAR PROFESSOR
    // ======================================================

    async function authenticateTeacher() {

      const passwordInput =
        document.getElementById(
          "teacherPassword"
        );


      const errorElement =
        document.getElementById(
          "teacherLoginError"
        );


      const button =
        document.getElementById(
          "teacherEnterBtn"
        );


      const password =
        passwordInput.value.trim();


      if (!password) {

        errorElement.textContent =
          "Digite o código de acesso.";


        errorElement.style.display =
          "block";


        return;

      }



      button.disabled = true;

      button.textContent =
        "Validando...";


      errorElement.style.display =
        "none";



      try {


        // ==================================================
        // SENHA É VALIDADA NO SERVIDOR
        //
        // NÃO EXISTE SENHA DENTRO DESTE HTML.
        // ==================================================

        const response =
          await fetch(
            "/api/teacher-login",
            {

              method: "POST",

              credentials: "include",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  password:
                    password

                })

            }
          );



        if (!response.ok) {

          throw new Error(
            "Senha inválida"
          );

        }



        const data =
          await response.json();



        if (!data.success) {

          throw new Error(
            "Senha inválida"
          );

        }



        // ==================================================
        // AUTORIZADO
        // ==================================================

        teacherMode =
          true;



        closeTeacherLogin();



        document.getElementById(
          "teacherStatus"
        ).style.display =
          "block";



        document.getElementById(
          "teacherLoginBtn"
        ).textContent =
          "🔓 Modo Professor Ativo";



        // ==================================================
        // BUSCAR DADOS PROTEGIDOS
        // ==================================================

        await carregarDadosProfessor();



        alert(
          "Modo Professor ativado.\n\n" +
          "Ao selecionar uma aula, o painel do professor e o Google Meet serão abertos."
        );


      }

      catch (error) {


        console.error(
          error
        );


        errorElement.textContent =
          "Código de acesso inválido.";


        errorElement.style.display =
          "block";

      }

      finally {


        button.disabled =
          false;


        button.textContent =
          "Entrar";

      }

    }



    // ======================================================
    // DADOS PROTEGIDOS DO PROFESSOR
    //
    // Meet URL não fica neste HTML.
    // ======================================================

    async function carregarDadosProfessor() {

      try {


        const response =
          await fetch(
            "/api/teacher-info",
            {

              method: "GET",

              credentials:
                "include"

            }
          );



        if (!response.ok) {

          throw new Error(
            "Não autorizado"
          );

        }



        const data =
          await response.json();



        googleMeetUrl =
          data.meetUrl || null;


      }

      catch (error) {


        console.error(
          "Erro ao carregar dados do professor:",
          error
        );


        googleMeetUrl =
          null;

      }

    }



    // ======================================================
    // AMBIENTE DO PROFESSOR
    // ======================================================

    function atualizarAmbienteProfessor(
      numero
    ) {


      if (!teacherMode) {

        return;

      }



      const teacherUrl =
        `./conteudo/professor.html?lesson=${numero}`;



      // ====================================================
      // PROFESSOR
      //
      // Sempre acompanha a Lesson atual.
      // ====================================================

      if (
        !teacherTab ||
        teacherTab.closed
      ) {


        teacherTab =
          window.open(
            teacherUrl,
            "teacherPanel"
          );

      }


      else {


        try {


          teacherTab.location.href =
            teacherUrl;


        }

        catch (error) {


          console.warn(
            "Não foi possível atualizar o professor.",
            error
          );

        }

      }



      // ====================================================
      // GOOGLE MEET
      //
      // ABRE SOMENTE UMA VEZ.
      //
      // Depois disso NÃO mudamos URL,
      // NÃO damos focus,
      // NÃO damos reload.
      // ====================================================

      if (
        !meetOpened &&
        googleMeetUrl
      ) {


        meetTab =
          window.open(
            googleMeetUrl,
            "googleMeet"
          );



        if (meetTab) {


          meetOpened =
            true;


          console.log(
            "Google Meet aberto."
          );

        }


        else {


          console.warn(
            "Google Meet bloqueado pelo navegador."
          );

        }

      }

    }



    // ======================================================
    // ENTER NO CAMPO DE SENHA
    // ======================================================

    document
      .getElementById(
        "teacherPassword"
      )
      .addEventListener(
        "keydown",
        function (event) {


          if (
            event.key ===
            "Enter"
          ) {


            event.preventDefault();


            authenticateTeacher();

          }

        }
      );



    // ======================================================
    // ESC FECHA LOGIN
    // ======================================================

    document.addEventListener(
      "keydown",
      function (event) {


        if (
          event.key ===
          "Escape"
        ) {


          closeTeacherLogin();

        }

      }
    );



    // ======================================================
    // INICIALIZAÇÃO
    // ======================================================

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        createLessonMenu();


      }
    );


  </script>


</body>

</html>
